[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "efnd"
version = "0.1.0"
description = "Evidence-Aware Hybrid Transformer Framework for Explainable Fake News Detection and Claim Verification"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Research Author" }]

dependencies = [
    "torch>=2.3.1",
    "transformers>=4.42.4",
    "tokenizers>=0.19.1",
    "datasets>=2.20.0",
    "accelerate>=0.31.0",
    "sentence-transformers>=3.0.1",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.1",
    "scipy>=1.13.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "pyyaml>=6.0.1",
    "shap>=0.46.0",
    "fastapi>=0.111.1",
    "uvicorn[standard]>=0.30.3",
    "streamlit>=1.37.0",
    "httpx>=0.27.0",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "tqdm>=4.66.4",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.3",
    "einops>=0.8.0",
    "safetensors>=0.4.3",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.6",
    "structlog>=24.4.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu==1.7.2",
]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "ruff==0.5.5",
    "mypy==1.10.1",
    "ipykernel==6.29.5",
    "jupyterlab==4.2.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["efnd*"]
exclude = ["venv*", "tests*", "scripts*", "app*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
